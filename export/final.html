<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkTree</title>

    <style>
        body, html {
            margin: 0px;
            height: 100%;

            background-image: linear-gradient(45deg,#F6AE2D,#F26419);

            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            height: 90%;
            aspect-ratio: 9/16;

            position: absolute;
            transform: translate(-50%,-50%);
            top: 50%;
            left: 50%;

            background-color: #86BBD8;

            border-radius: 2vh;
            box-shadow: 1vh 1vh 1vh #00000060;
        }

        #Title {
            width: 90%;
            height: 30%;

            position: absolute;
            transform: translate(-50%,-50%);
            top: 18%;
            left: 50%;

            font-size: 3.5vh;
        }

        #Image {
            height: 60%;
            aspect-ratio: 1/1;

            position: absolute;
            transform: translate(-50%,0);
            left: 50%;

            background-image: url(https://images.icon-icons.com/912/PNG/512/add-picture_icon-icons.com_71785.png);
            background-size: 50%;
            background-repeat: no-repeat;
            background-position: 60%;

            border-radius: 100%;
            border: solid 0.5vh;
            box-sizing: border-box;
        }

        h1 {
            position: absolute;
            transform: translate(-50%,-50%);
            left: 50%;
            top: 72%;
            margin: 0px;
        }

        h2 {
            position: absolute;
            transform: translate(-50%,-50%);
            left: 50%;
            top: 90%;
            margin: 0px;
        }

        #Links {
            width: 90%;
            height: 60%;

            position: absolute;
            transform: translate(-50%,0%);
            left: 50%;
            top: 36%;
        }

        a {
            width: 100%;
            height: 23%;
            display: block;

            position: relative;
            margin-bottom: 4%;

            background-color: #33658A;

            border-radius: 2vh;
            border: solid 0.5vh rgb(31, 81, 118);
            box-sizing: border-box;
        }

        a:visited, a:active {
            color: unset;
        }

        h3 {
            width: 100%;

            position: absolute;
            margin: 0px;
            transform: translate(0%,-50%);
            top: 50%;

            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <div id="Title">
            <div id="Image">
                <img src="">
            </div>
            <h1>LinkTree</h1>
            <h2>Generator</h2>
        </div>
        <div id="Links">
            <a href="" target="_blank"><h3>Your Link Here</h3></a>
            <a href="" target="_blank"><h3>Your Link Here</h3></a>
            <a href="" target="_blank"><h3>Your Link Here</h3></a>
            <a href="" target="_blank"><h3>Your Link Here</h3></a>
        </div>
    </main>
</body>
</html>
