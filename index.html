<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkTree</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="Main">            
        <div id="Title"> 
            <div id="Image">
                <img id="Logo">
                <input type="file" id="ImageInput" accept="image/*">
            </div>

            <input type="text" class="Options" id="TitleInput" value="LinkTree">
            <input type="text" class="Options" id="SubtitleInput" value="Generator">

        </div>

        <div id="Links">
            <div class="LinkContainer">
                <div class="Color" id="LinkColor"><input type="color" id="LinkColorInput"></div>
                <input type="text" class="Options" id="LinkText" value="Your link here" onclick="event.preventDefault(); event.stopPropagation();">
                <input type="text" class="Options" id="LinkURL" value="Paste the URL here" onclick="event.preventDefault(); event.stopPropagation();">
            </div>

            <div class="LinkContainer">
                <input type="text" class="Options" id="LinkText" value="Your link here" onclick="event.preventDefault(); event.stopPropagation();">
                <input type="text" class="Options" id="LinkURL" value="Paste the URL here" onclick="event.preventDefault(); event.stopPropagation();">
            </div>

            <div class="LinkContainer">
                <input type="text" class="Options" id="LinkText" value="Your link here" onclick="event.preventDefault(); event.stopPropagation();">
                <input type="text" class="Options" id="LinkURL" value="Paste the URL here" onclick="event.preventDefault(); event.stopPropagation();">
            </div>

            <div class="LinkContainer">
                <input type="text" class="Options" id="LinkText" value="Your link here" onclick="event.preventDefault(); event.stopPropagation();">
                <input type="text" class="Options" id="LinkURL" value="Paste the URL here" onclick="event.preventDefault(); event.stopPropagation();">
            </div>
   
            <div class="Options" id="NewLink">
                <img src="media/mais.png" id="Add">
                <img src="media/mais.png" id="Remove">
            </div>
        </div>

        <div class="Color" id="MainColor"><input type="color" id="MainColorInput"></div>
    </main>
    
    <a class="Options" id="Download" download="LinkTree">
        <img src="https://images.icon-icons.com/1369/PNG/96/-file-download_90117.png" id="DownloadIcon">
    </a>    
    
    <div class="Color" id="BackgroundFirstColor"><input type="color" id="FirstColorInput"></div>
    <div class="Color" id="BackgroundSecondColor"><input type="color" id="SecondColorInput"></div>

    <script src="https://unpkg.com/jszip@3.7.1/dist/jszip.min.js"></script>   
    <script src="script.js"></script>
</body>
</html>
